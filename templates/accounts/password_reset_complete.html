{% extends "base.html" %}{% load i18n %}
{% block title %}{% trans "Password reset" %}{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-title">
    <h1>{% trans "Password changed" %}</h1>
  </div>
</div>
<div class="card narrow">
  <p>{% trans "Your password has been set. You can log in now." %}</p>
  <div class="actions"><a class="btn btn-primary" href="{% url 'accounts:login' %}">{% trans "Log in" %}</a></div>
</div>
{% endblock %}
