{% load i18n %}{% if page.has_other_pages %}
<nav class="pagination actions" aria-label="{% trans 'Pagination' %}">
  {% if page.has_previous %}<a class="btn btn-sm" href="?{% if query %}{{ query }}&{% endif %}page={{ page.previous_page_number }}">‹ {% trans "Previous" %}</a>{% endif %}
  <span class="small muted">{% blocktrans with n=page.number total=page.paginator.num_pages %}Page {{ n }} of {{ total }}{% endblocktrans %}</span>
  {% if page.has_next %}<a class="btn btn-sm" href="?{% if query %}{{ query }}&{% endif %}page={{ page.next_page_number }}">{% trans "Next" %} ›</a>{% endif %}
</nav>
{% endif %}
