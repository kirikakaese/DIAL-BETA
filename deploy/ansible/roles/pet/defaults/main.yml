---
pet_repo_url: https://github.com/example/pet.git
pet_repo_version: main
pet_dir: /opt/pet
pet_src_dir: "{{ pet_dir }}/src"

pet_public_url: http://localhost:8000
pet_secret_key: CHANGE-ME
pet_db_password: pet
pet_pbx_password: pet          # ARI/AMI password and PBX hook secret
pet_external_ip: ""
pet_seed_demo: "1"

# Rendered 1:1 into .env (see .env.example for the meaning of each key).
pet_env:
  DJANGO_SETTINGS_MODULE: pet.settings.prod
  SECRET_KEY: "{{ pet_secret_key }}"
  DEBUG: "0"
  ALLOWED_HOSTS: "*"
  CSRF_TRUSTED_ORIGINS: "{{ pet_public_url }}"
  PET_PUBLIC_URL: "{{ pet_public_url }}"
  TIME_ZONE: Europe/Berlin
  EMAIL_URL: consolemail://
  DEFAULT_FROM_EMAIL: pet@example.org
  SESSION_COOKIE_SECURE: "{{ '1' if pet_public_url.startswith('https') else '0' }}"
  CSRF_COOKIE_SECURE: "{{ '1' if pet_public_url.startswith('https') else '0' }}"
  PET_FEATURES: ""
  PET_CDR_RETENTION_DAYS: "30"
  PET_DECT_BACKEND: apps.dect.backends.dummy.DummyDECT
  OMM_HOST: ""
  OMM_USER: omm
  OMM_PASSWORD: ""
  POSTGRES_USER: pet
  POSTGRES_PASSWORD: "{{ pet_db_password }}"
  POSTGRES_DB: pet
  ARI_USER: pet
  ARI_PASSWORD: "{{ pet_pbx_password }}"
  AMI_USER: pet
  AMI_PASSWORD: "{{ pet_pbx_password }}"
  PET_PBX_HOOK_SECRET: "{{ pet_pbx_password }}"
  SIP_DOMAIN: pet.local
  EXTERNAL_IP: "{{ pet_external_ip }}"
  PET_EVENTS: demo
  WEB_CONCURRENCY: "3"
  PET_SEED_DEMO: "{{ pet_seed_demo }}"
pet_env_extra: {}
