---
- name: Install prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, git]
    state: present
    update_cache: true

- name: Ensure apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker apt key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker engine and compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true

- name: Ensure Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create PET directory
  ansible.builtin.file:
    path: "{{ pet_dir }}"
    state: directory
    mode: "0750"

- name: Check out PET sources (includes docker-compose.yml and deploy/asterisk)
  ansible.builtin.git:
    repo: "{{ pet_repo_url }}"
    dest: "{{ pet_src_dir }}"
    version: "{{ pet_repo_version }}"
    force: true
  notify: Restart pet stack

- name: Render .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ pet_src_dir }}/.env"
    mode: "0600"
  notify: Restart pet stack

- name: Pull base images
  ansible.builtin.command:
    cmd: docker compose pull --ignore-buildable
    chdir: "{{ pet_src_dir }}"
  changed_when: false

- name: Build and start the stack
  ansible.builtin.command:
    cmd: docker compose up -d --build --remove-orphans
    chdir: "{{ pet_src_dir }}"
  register: pet_up
  changed_when: "'Started' in pet_up.stderr or 'Created' in pet_up.stderr"
