; DIAL - odbc.ini (DSN used by res_odbc.conf [asterisk])
[asterisk]
Description = DIAL database
Driver = PostgreSQL Unicode
Servername = ${DB_HOST}
Port = ${DB_PORT}
Database = ${DB_NAME}
UserName = ${DB_USER}
Password = ${DB_PASSWORD}
ReadOnly = No
Protocol = 7.4
UseServerSidePrepare = 1
BoolsAsChar = 1
