; PET - manager.conf: AMI (optional; used by PET only as originate fallback, DeviceStateList and
; "Reload pbx_config" after sync_event so new [pet-<slug>] shell contexts appear).
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = no
timestampevents = yes
webenabled = no
authtimeout = 30
authlimit = 50

[${AMI_USER}]
secret = ${AMI_PASSWORD}
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.0
permit = 10.0.0.0/255.0.0.0
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
read = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan,originate
write = system,call,command,originate,reporting,config
eventfilter = !Event: RTCP*
eventfilter = !Event: VarSet
