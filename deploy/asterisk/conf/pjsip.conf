; DIAL - pjsip.conf
; Only transports and global settings live here. Endpoints, auths, AORs and contacts are
; realtime rows (ps_endpoints / ps_auths / ps_aors / ps_contacts) written by DIAL - see sorcery.conf.

[global]
type=global
user_agent=DIAL-Asterisk
default_realm=${SIP_DOMAIN}
; username first so devices are matched by their auth/AOR name, IP for trunks (ps_endpoint_id_ips)
endpoint_identifier_order=username,ip,anonymous
max_forwards=20
keep_alive_interval=30
contact_expiration_check_interval=30
default_from_user=dial
; unidentified requests (wrong credentials) are logged, not hammered
unidentified_request_count=5
unidentified_request_period=5
unidentified_request_prune_interval=30

[system]
type=system
timer_t1=500
timer_b=32000
compact_headers=no

;--- transports ------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
allow_reload=yes
; uncomment (entrypoint does this when SIP_EXTERNAL_IP is set) for bridge networking / NAT
;external_media_address=
;external_signaling_address=
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
allow_reload=yes

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2
allow_reload=yes
; Note: the cert is self-signed unless you mount your own into /etc/asterisk/keys;
; handsets/softphones must be told to accept it.

; WebRTC scaffold: secure WebSocket on 8089 (TLS settings come from http.conf)
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0
allow_reload=yes

;--- GSM gateway trunk (optional) --------------------------------------------------
; DIAL dials GSM handsets as PJSIP/<msisdn>@<Event.gsm_trunk> (default "gsm-gateway") when the
; event has "has_gsm" enabled. Point this at the SIP side of your on-site cell network
; (e.g. osmo-sip-connector in front of osmo-msc). Uncomment and adjust the IP address.
;[gsm-gateway]
;type=endpoint
;context=dial-inbound
;disallow=all
;allow=alaw
;allow=ulaw
;allow=gsm
;transport=transport-udp
;aors=gsm-gateway
;direct_media=no
;rtp_symmetric=yes
;force_rport=yes
;from_user=dial
;
;[gsm-gateway]
;type=aor
;contact=sip:10.0.0.10:5060
;qualify_frequency=30
;
;[gsm-gateway]
;type=identify
;endpoint=gsm-gateway
;match=10.0.0.10
