; DIAL - extensions.conf (static part)
;
; Per-event routing lives in the realtime table `extensions` (context dial-<slug>), written by
; apps.pbx.backends.asterisk. Each event needs a tiny static *shell* context
;
;     [dial-demo]
;     include => dial-internal
;     switch => Realtime/@
;
; so that pbx_realtime is consulted for that context name. Shell contexts are pulled from DIAL
; (GET /api/v1/pbx/dialplan/?shell=1) by the #exec below at load/`dialplan reload` time, falling
; back to the DIAL_EVENTS environment variable when DIAL is unreachable.
;
; Call flow for a DECT/SIP extension 4242 in event demo (rows written by DIAL):
;   PJSIP/demo-aaaa dials 4242 -> endpoint context dial-demo -> realtime rows:
;   Set(__DIAL_EVENT=demo) Set(DIAL_EXTEN=4242) Set(DIAL_ALLOW_CB=1) Set(DIAL_PRIORITY=0)
;   Set(CHANNEL(hangup_handler_push)=dial-hangup,s,1) Dial(PJSIP/x&PJSIP/y,30,tT) -> busy/noanswer branches
;   On hangup [dial-hangup] tells DIAL both numbers are idle again (CCBS).

[general]
static=yes
writeprotect=yes
clearglobalvars=no
autofallthrough=yes
extenpatternmatchnew=no

[globals]
DIAL_API=${DIAL_API_URL}
DIAL_SECRET=${DIAL_PBX_HOOK_SECRET}
DIAL_EMERGENCY_FALLBACK_NUM=${DIAL_EMERGENCY_FALLBACK}
DIAL_CDR_HOOK_ENABLED=${DIAL_CDR_HOOK}
DIAL_DEFAULT_TIMEOUT=30

;================================================================================================
; Event shell contexts ([dial-<slug>]) - generated
;================================================================================================
#exec /opt/dial/scripts/dial_contexts.sh

;================================================================================================
; Helpers
;================================================================================================
; Gosub(dial-sound,s,1(<preferred>,<fallback>)) -> ${GOSUB_RETVAL} = first sound file that exists.
; Custom DIAL prompts live in /var/lib/asterisk/sounds/dial/ (volume); until recorded, core sounds are used.
[dial-sound]
exten => s,1,Set(DIAL_S_BASE=/var/lib/asterisk/sounds)
 same => n,GotoIf($[${STAT(e,${DIAL_S_BASE}/${ARG1}.wav)} | ${STAT(e,${DIAL_S_BASE}/${ARG1}.gsm)} | ${STAT(e,${DIAL_S_BASE}/${ARG1}.sln)} | ${STAT(e,${DIAL_S_BASE}/${ARG1}.sln16)} | ${STAT(e,${DIAL_S_BASE}/${CHANNEL(language)}/${ARG1}.wav)} | ${STAT(e,${DIAL_S_BASE}/${CHANNEL(language)}/${ARG1}.gsm)}]?found)
 same => n,Return(${ARG2})
 same => n(found),Return(${ARG1})

; Gosub(dial-play,s,1(<preferred>,<fallback>)) - Playback with fallback
[dial-play]
exten => s,1,Gosub(dial-sound,s,1(${ARG1},${ARG2}))
 same => n,Playback(${GOSUB_RETVAL})
 same => n,Return()

; Configure CURL() for talking to DIAL (auth header + short timeouts so a dead DIAL never hangs a call)
[dial-curl]
exten => s,1,Set(CURLOPT(httpheader)=X-DIAL-PBX-Secret: ${DIAL_SECRET})
 same => n,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(dnstimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=8)
 same => n,Set(CURLOPT(failurecodes)=yes)
 same => n,Return()

; Gosub(dial-hook,s,1(<kind>,<form-data>)) -> DIAL_HOOK_RESULT (raw JSON), DIAL_HOOK_HANDLED (1/0)
[dial-hook]
exten => s,1,Gosub(dial-curl,s,1)
 same => n,Set(DIAL_HOOK_RESULT=${CURL(${DIAL_API}/api/v1/pbx/hooks/${ARG1}/,${ARG2})})
 same => n,Set(DIAL_HOOK_HANDLED=${JSON_DECODE(DIAL_HOOK_RESULT,handled)})
 same => n,ExecIf($["${DIAL_HOOK_HANDLED}" = "true" | "${DIAL_HOOK_HANDLED}" = "1"]?Set(DIAL_HOOK_HANDLED=1):Set(DIAL_HOOK_HANDLED=0))
 same => n,Return()

; Gosub(dial-lookup,s,1(<number>)) -> DIAL_ROUTE (raw JSON) + DIAL_R_* convenience variables
[dial-lookup]
exten => s,1,Gosub(dial-curl,s,1)
 same => n,Set(DIAL_ROUTE=${CURL(${DIAL_API}/api/v1/pbx/route/?event=${DIAL_EVENT}&number=${URIENCODE(${ARG1})})})
 same => n,Set(DIAL_R_TYPE=${JSON_DECODE(DIAL_ROUTE,type)})
 same => n,Set(DIAL_R_DIAL=${JSON_DECODE(DIAL_ROUTE,dial_string)})
 same => n,Set(DIAL_R_STRATEGY=${JSON_DECODE(DIAL_ROUTE,strategy)})
 same => n,Set(DIAL_R_TIMEOUT=${JSON_DECODE(DIAL_ROUTE,timeout)})
 same => n,Set(DIAL_R_FWD_BUSY=${JSON_DECODE(DIAL_ROUTE,forward_busy)})
 same => n,Set(DIAL_R_FWD_NA=${JSON_DECODE(DIAL_ROUTE,forward_noanswer)})
 same => n,Set(DIAL_R_FWD_UNCOND=${JSON_DECODE(DIAL_ROUTE,forward_unconditional)})
 same => n,ExecIf($["${DIAL_R_TIMEOUT}" = "" | "${DIAL_R_TIMEOUT}" = "null"]?Set(DIAL_R_TIMEOUT=${DIAL_DEFAULT_TIMEOUT}))
 same => n,ExecIf($["${DIAL_R_TYPE}" = "null"]?Set(DIAL_R_TYPE=))
 same => n,ExecIf($["${DIAL_R_DIAL}" = "null"]?Set(DIAL_R_DIAL=))
 same => n,Return()

; Gosub(dial-dial,s,1(<dial-string a&b&c>,<strategy>,<timeout>)) - ring targets in parallel or serially
[dial-dial]
exten => s,1,NoOp(DIAL dial ${ARG1} strategy=${ARG2} timeout=${ARG3})
 same => n,Set(DIAL_D_TIMEOUT=${IF($["${ARG3}" = ""]?${DIAL_DEFAULT_TIMEOUT}:${ARG3})})
 same => n,GotoIf($["${ARG1}" = ""]?none)
 same => n,GotoIf($["${ARG2}" = "serial"]?serial)
 same => n,Dial(${ARG1},${DIAL_D_TIMEOUT},tT)
 same => n,Return()
 same => n(serial),Set(DIAL_D_I=1)
 same => n(loop),Set(DIAL_D_T=${CUT(ARG1,&,${DIAL_D_I})})
 same => n,GotoIf($["${DIAL_D_T}" = ""]?exhausted)
 same => n,Dial(${DIAL_D_T},${DIAL_D_TIMEOUT},tT)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?exhausted)
 same => n,Set(DIAL_D_I=$[${DIAL_D_I} + 1])
 same => n,Goto(loop)
 same => n(exhausted),Return()
 same => n(none),Set(DIALSTATUS=CHANUNAVAIL)
 same => n,Return()

; Gosub(dial-after-dial,s,1(<fwd_busy>,<fwd_noanswer>)) - apply forwards after an unsuccessful Dial
[dial-after-dial]
exten => s,1,NoOp(DIAL after dial: ${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${ARG2}" != ""]?fwdna)
 same => n,Playback(vm-nobodyavail)
 same => n,Hangup()
 same => n(fwdna),Goto(dial-${DIAL_EVENT},${ARG2},1)
 same => n(busy),GotoIf($["${ARG1}" != ""]?fwdbusy)
 same => n,Busy(10)
 same => n,Hangup()
 same => n(fwdbusy),Goto(dial-${DIAL_EVENT},${ARG1},1)

;================================================================================================
; Generic fallbacks included by every [dial-<slug>] shell context (checked AFTER the realtime rows)
;================================================================================================
[dial-internal]
; anything DIAL has no realtime row for: ask the route API (emergency / federation / breakout)
exten => _[0-9*#].,1,NoOp(DIAL: ${EXTEN} not in realtime rows of dial-${DIAL_EVENT} - asking DIAL)
 same => n,Set(CHANNEL(hangup_handler_push)=dial-hangup,s,1)
 same => n,Gosub(dial-route,s,1(${EXTEN}))
 same => n,Hangup()
exten => i,1,Playback(pbx-invalid)
 same => n,Hangup()
exten => t,1,Hangup()
exten => h,1,NoOp()

; Gosub(dial-route,s,1(<number>)): route whatever DIAL says (used for unknown numbers,
; federation and breakout extension types)
[dial-route]
exten => s,1,Gosub(dial-lookup,s,1(${ARG1}))
 same => n,GotoIf($["${DIAL_R_TYPE}" = "emergency"]?emergency)
 same => n,GotoIf($["${DIAL_R_DIAL}" = ""]?invalid)
 same => n,Gosub(dial-dial,s,1(${DIAL_R_DIAL},${DIAL_R_STRATEGY},${DIAL_R_TIMEOUT}))
 same => n,Gosub(dial-after-dial,s,1(${DIAL_R_FWD_BUSY},${DIAL_R_FWD_NA}))
 same => n,Return()
 same => n(emergency),Goto(dial-emergency,${ARG1},1)
 same => n(invalid),Playback(pbx-invalid)
 same => n,Return()

;================================================================================================
; Hangup handler: tell DIAL both parties are idle again (fires pending CCBS/CCNR callbacks)
;================================================================================================
[dial-hangup]
exten => s,1,NoOp(DIAL hangup ${CHANNEL} dialstatus=${DIALSTATUS} cause=${HANGUPCAUSE})
 same => n,GotoIf($["${DIAL_EVENT}" = ""]?done)
 same => n,Gosub(dial-curl,s,1)
 same => n,ExecIf($["${CALLERID(num)}" != ""]?Set(DIAL_R1=${CURL(${DIAL_API}/api/v1/pbx/hooks/extension-idle/,event=${DIAL_EVENT}&number=${URIENCODE(${CALLERID(num)})}&channel=${URIENCODE(${CHANNEL})})}))
 same => n,ExecIf($["${DIAL_EXTEN}" != "" & "${DIAL_EXTEN}" != "${CALLERID(num)}"]?Set(DIAL_R2=${CURL(${DIAL_API}/api/v1/pbx/hooks/extension-idle/,event=${DIAL_EVENT}&number=${URIENCODE(${DIAL_EXTEN})}&channel=${URIENCODE(${CHANNEL})})}))
 same => n,GotoIf($["${DIAL_CDR_HOOK_ENABLED}" != "yes"]?done)
 same => n,Set(DIAL_R3=${CURL(${DIAL_API}/api/v1/pbx/hooks/cdr/,event=${DIAL_EVENT}&src=${URIENCODE(${CDR(src)})}&dst=${URIENCODE(${CDR(dst)})}&start=${URIENCODE(${CDR(start)})}&answer=${URIENCODE(${CDR(answer)})}&end=${URIENCODE(${CDR(end)})}&duration=${CDR(duration)}&billsec=${CDR(billsec)}&disposition=${CDR(disposition)}&channel=${URIENCODE(${CDR(channel)})}&dstchannel=${URIENCODE(${CDR(dstchannel)})}&uniqueid=${URIENCODE(${CDR(uniqueid)})}&dcontext=${CDR(dcontext)}&accountcode=${CDR(accountcode)})})
 same => n(done),Return()

;================================================================================================
; Feature codes: Gosub(dial-feature,s,1(<code>,<target>)) from realtime rows *66 / _*66.
;================================================================================================
[dial-feature]
exten => s,1,NoOp(DIAL feature code ${ARG1} target=${ARG2} from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.3)
 same => n,Gosub(dial-hook,s,1(feature-code,event=${DIAL_EVENT}&caller=${CALLERID(num)}&code=${ARG1}&target=${ARG2}))
 same => n,GotoIf($["${DIAL_HOOK_HANDLED}" = "1"]?ok)
 same => n,Playback(pbx-invalid)
 same => n,Return()
 same => n(ok),Playback(beep)
 same => n,Playback(auth-thankyou)
 same => n,Return()

;================================================================================================
; Groups: Gosub(dial-group,s,1(<group number>)) - members come from the route API
;
; Optional extras in the route JSON (ignored when absent, so older DIAL versions keep working):
;   callerid_prefix   "[SEC] "  -> prepended to the caller name so members see which group rings
;   dial_string_waves "PJSIP/a&Local/005*4300@dial-group" -> ring-all with per-member ring delays;
;                     delayed legs are Local channels into the _XXX*X. exten below (<delay>*<number>)
;================================================================================================
[dial-group]
exten => s,1,NoOp(DIAL group ${ARG1})
 same => n,Gosub(dial-lookup,s,1(${ARG1}))
 same => n,GotoIf($["${DIAL_R_FWD_UNCOND}" != ""]?uncond)
 same => n,Set(DIAL_G_PREFIX=${JSON_DECODE(DIAL_ROUTE,callerid_prefix)})
 same => n,ExecIf($["${DIAL_G_PREFIX}" = "null"]?Set(DIAL_G_PREFIX=))
 same => n,ExecIf($["${DIAL_G_PREFIX}" != ""]?Set(CALLERID(name)=${DIAL_G_PREFIX}${CALLERID(name)}))
 same => n,Set(DIAL_G_WAVES=${JSON_DECODE(DIAL_ROUTE,dial_string_waves)})
 same => n,ExecIf($["${DIAL_G_WAVES}" = "null"]?Set(DIAL_G_WAVES=))
 same => n,ExecIf($["${DIAL_G_WAVES}" != "" & "${DIAL_R_STRATEGY}" != "serial"]?Set(DIAL_R_DIAL=${DIAL_G_WAVES}))
 same => n,GotoIf($["${DIAL_R_DIAL}" = ""]?nobody)
 same => n,Gosub(dial-dial,s,1(${DIAL_R_DIAL},${DIAL_R_STRATEGY},${DIAL_R_TIMEOUT}))
 same => n,Gosub(dial-after-dial,s,1(${DIAL_R_FWD_BUSY},${DIAL_R_FWD_NA}))
 same => n,Return()
 same => n(uncond),Goto(dial-${DIAL_EVENT},${DIAL_R_FWD_UNCOND},1)
 same => n(nobody),GotoIf($["${DIAL_R_FWD_NA}" != ""]?fwd)
 same => n,Answer()
 same => n,Playback(vm-nobodyavail)
 same => n,Return()
 same => n(fwd),Goto(dial-${DIAL_EVENT},${DIAL_R_FWD_NA},1)
; Delayed ring-all leg: Local/<delay, 3 digits>*<member number>@dial-group. Waits, then rings the member
; through its normal route in the event context. The outer Dial() tears this leg down when someone
; else answers or the group timeout expires, so the inner timeout only needs to be generous.
exten => _XXX*X.,1,NoOp(DIAL group delayed leg ${EXTEN})
 same => n,Wait(${CUT(EXTEN,*,1)})
 same => n,Dial(Local/${CUT(EXTEN,*,2)}@dial-${DIAL_EVENT},${DIAL_DEFAULT_TIMEOUT},tT)
 same => n,Hangup()

;================================================================================================
; Announcements + IVR menus: Gosub(dial-ivr,s,1(<number>,<announcement|ivr>))
; Route API returns ivr_greeting (sound file, e.g. dial/<uuid>), ivr_timeout, ivr_options {digit: number}
;================================================================================================
[dial-ivr]
exten => s,1,NoOp(DIAL ${ARG2} ${ARG1})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Gosub(dial-lookup,s,1(${ARG1}))
 same => n,Set(DIAL_IVR_GREETING=${JSON_DECODE(DIAL_ROUTE,ivr_greeting)})
 same => n,Set(DIAL_IVR_TIMEOUT=${JSON_DECODE(DIAL_ROUTE,ivr_timeout)})
 same => n,ExecIf($["${DIAL_IVR_GREETING}" = "" | "${DIAL_IVR_GREETING}" = "null"]?Set(DIAL_IVR_GREETING=dial/default-announcement))
 same => n,ExecIf($["${DIAL_IVR_TIMEOUT}" = "" | "${DIAL_IVR_TIMEOUT}" = "null"]?Set(DIAL_IVR_TIMEOUT=5))
 same => n,Gosub(dial-sound,s,1(${DIAL_IVR_GREETING},hello-world))
 same => n,Set(DIAL_IVR_GREETING=${GOSUB_RETVAL})
 same => n,GotoIf($["${ARG2}" = "announcement"]?announce)
 same => n,Set(DIAL_IVR_TRIES=0)
 same => n(menu),Read(DIAL_IVR_CHOICE,${DIAL_IVR_GREETING},1,,1,${DIAL_IVR_TIMEOUT})
 same => n,GotoIf($["${DIAL_IVR_CHOICE}" = ""]?retry)
 same => n,Set(DIAL_IVR_TARGET=${JSON_DECODE(DIAL_ROUTE,ivr_options.${DIAL_IVR_CHOICE})})
 same => n,GotoIf($["${DIAL_IVR_TARGET}" = "" | "${DIAL_IVR_TARGET}" = "null"]?invalid)
 same => n,Goto(dial-${DIAL_EVENT},${DIAL_IVR_TARGET},1)
 same => n(invalid),Playback(pbx-invalid)
 same => n(retry),Set(DIAL_IVR_TRIES=$[${DIAL_IVR_TRIES} + 1])
 same => n,GotoIf($[${DIAL_IVR_TRIES} < 3]?menu)
 same => n,Playback(vm-goodbye)
 same => n,Return()
 same => n(announce),Playback(${DIAL_IVR_GREETING})
 same => n,Wait(0.5)
 same => n,Return()

;================================================================================================
; Application extensions: Gosub(dial-app,s,1(<app>)) -> extension <app> in [dial-services]
;================================================================================================
[dial-app]
exten => s,1,NoOp(DIAL app ${ARG1})
 same => n,GotoIf(${DIALPLAN_EXISTS(dial-services,${ARG1},1)}?dial-services,${ARG1},1)
 same => n,Playback(pbx-invalid)
 same => n,Return()

;================================================================================================
; Emergency numbers (112/110/911...): realtime rows Goto here; DIAL may supply a route
;================================================================================================
[dial-emergency]
exten => _[0-9].,1,NoOp(***** EMERGENCY ${EXTEN} from ${CALLERID(all)} event=${DIAL_EVENT} *****)
 same => n,Set(DIAL_PRIORITY=100)
 same => n,Set(CHANNEL(hangup_handler_push)=dial-hangup,s,1)
 same => n,Gosub(dial-lookup,s,1(${EXTEN}))
 same => n,GotoIf($["${DIAL_R_DIAL}" = ""]?fallback)
 same => n,Dial(${DIAL_R_DIAL},90,tT)
 same => n(fallback),GotoIf($["${DIAL_EMERGENCY_FALLBACK_NUM}" = ""]?none)
 same => n,Dial(Local/${DIAL_EMERGENCY_FALLBACK_NUM}@dial-${DIAL_EVENT},90,tT)
 same => n(none),Answer()
 same => n,Gosub(dial-play,s,1(dial/emergency-unavailable,ss-noservice))
 same => n,Hangup()

;================================================================================================
; Services. Reached via realtime rows (Goto(dial-services,<svc>,1)) for the plan's service numbers,
; via Gosub(dial-app,...) for `app` extensions, and as the *originate* target of AsteriskPBX.originate():
;   POST /ari/channels endpoint=Local/<dest>@dial-<slug> context=dial-services extension=${DIAL_SERVICE}
;================================================================================================
[dial-services]
; --- echo test (echo_test_number) ---
exten => echo,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; --- time announcement ---
exten => time,1,Answer()
 same => n,Wait(0.5)
 same => n,SayUnixTime(,,kM)
 same => n,Wait(0.5)
 same => n,Hangup()

; --- music on hold test ---
exten => moh,1,Answer()
 same => n,MusicOnHold(default,120)
 same => n,Hangup()

; --- hello world / generic announcement (DIAL_ANNOUNCEMENT = sound file) ---
exten => hello,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()
exten => announce,1,NoOp(DIAL announcement ${DIAL_ANNOUNCEMENT} priority=${DIAL_PRIORITY})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,GotoIf($["${DIAL_ANNOUNCEMENT}" != ""]?custom)
 same => n,Gosub(dial-play,s,1(dial/default-announcement,hello-world))
 same => n,Goto(done)
 same => n(custom),Gosub(dial-play,s,1(${DIAL_ANNOUNCEMENT},hello-world))
 same => n(done),Wait(0.5)
 same => n,Hangup()

; --- test ringback: user dials test_ringback_number; DIAL calls back after a delay ---
exten => ringback-request,1,Answer()
 same => n,Wait(0.3)
 same => n,Gosub(dial-hook,s,1(feature-code,event=${DIAL_EVENT}&caller=${CALLERID(num)}&code=ringback&target=${CALLERID(num)}))
 same => n,GotoIf($["${DIAL_HOOK_HANDLED}" = "1"]?ok)
 same => n,Playback(pbx-invalid)
 same => n,Hangup()
 same => n(ok),Playback(beep)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()
; originate target: callee answered -> beep + announcement
exten => ringback,1,NoOp(DIAL test ringback delivered to ${DIAL_DESTINATION})
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Gosub(dial-play,s,1(${IF($["${DIAL_ANNOUNCEMENT}" != ""]?${DIAL_ANNOUNCEMENT}:dial/ringback-ok)},demo-congrats))
 same => n,SayDigits(${DIAL_DESTINATION})
 same => n,Wait(0.5)
 same => n,Hangup()

; --- wake-up call: user dials wakeup_service_number and enters HHMM ---
exten => wakeup,1,Answer()
 same => n,Wait(0.3)
 same => n,Gosub(dial-sound,s,1(dial/wakeup-enter-time,vm-enter-num-to-call))
 same => n,Read(DIAL_WAKE,${GOSUB_RETVAL}&beep,4,,2,10)
 same => n,GotoIf($["${LEN(${DIAL_WAKE})}" != "4"]?bad)
 same => n,Gosub(dial-hook,s,1(feature-code,event=${DIAL_EVENT}&caller=${CALLERID(num)}&code=wakeup&target=${DIAL_WAKE}))
 same => n,GotoIf($["${DIAL_HOOK_HANDLED}" = "1"]?ok)
 same => n(bad),Playback(pbx-invalid)
 same => n,Hangup()
 same => n(ok),Playback(beep)
 same => n,SayNumber(${DIAL_WAKE:0:2})
 same => n,SayNumber(${DIAL_WAKE:2:2})
 same => n,Playback(auth-thankyou)
 same => n,Hangup()
; originate target of the wake-up call itself
exten => wakeup-call,1,NoOp(DIAL wake-up call to ${DIAL_DESTINATION})
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Gosub(dial-play,s,1(${IF($["${DIAL_ANNOUNCEMENT}" != ""]?${DIAL_ANNOUNCEMENT}:dial/wakeup-call)},hello-world))
 same => n,SayUnixTime(,,kM)
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,Hangup()

; --- callback delivery (CCBS/CCNR): DIAL originates to the requester, then bridges to the target ---
exten => callback,1,NoOp(DIAL callback ${DIAL_DESTINATION} -> ${DIAL_CALLBACK_TARGET})
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,GotoIf($["${DIAL_CALLBACK_TARGET}" = ""]?none)
 same => n,Gosub(dial-play,s,1(dial/callback-connecting,transfer))
 same => n,Set(__DIAL_EVENT=${DIAL_EVENT})
 same => n,Set(CALLERID(num)=${DIAL_DESTINATION})
 same => n,Dial(Local/${DIAL_CALLBACK_TARGET}@dial-${DIAL_EVENT},${IF($["${DIAL_TIMEOUT}" != ""]?${DIAL_TIMEOUT}:45)},tTg)
 same => n,Hangup()
 same => n(none),Playback(pbx-invalid)
 same => n,Hangup()

; --- DECT site survey: announce the RFP the caller is currently on, every few seconds ---
exten => survey,1,Answer()
 same => n,Wait(0.5)
 same => n,Gosub(dial-play,s,1(dial/survey-start,beep))
 same => n,Set(DIAL_SURVEY_LAST=)
 same => n(loop),Gosub(dial-hook,s,1(site-survey,event=${DIAL_EVENT}&caller=${CALLERID(num)}))
 same => n,Set(DIAL_RFP=${JSON_DECODE(DIAL_HOOK_RESULT,say)})
 same => n,GotoIf($["${DIAL_RFP}" = "" | "${DIAL_RFP}" = "null"]?nodata)
 same => n,GotoIf($["${DIAL_RFP}" = "${DIAL_SURVEY_LAST}"]?same)
 same => n,Set(DIAL_SURVEY_LAST=${DIAL_RFP})
 same => n,Playback(beep)
 same => n,SayAlpha(${DIAL_RFP})
 same => n,Wait(3)
 same => n,Goto(loop)
 same => n(same),Playback(beep)
 same => n,Wait(3)
 same => n,Goto(loop)
 same => n(nodata),Playback(vm-nomore)
 same => n,Wait(3)
 same => n,Goto(loop)

; --- voicemail access (voicemail_number): own mailbox, PIN from voicemail_users ---
exten => voicemail,1,Answer()
 same => n,Wait(0.5)
 same => n,VoiceMailMain(${CALLERID(num)}@dial-${DIAL_EVENT})
 same => n,Hangup()

; --- DECT claim (GURU3-style): bind the calling handset to the extension whose claim code is dialled ---
; Reached via <dect_claim_number> (code is then read via DTMF) or <dect_claim_number><code> en bloc
; (the realtime row sets DIAL_CLAIM_CODE). The hook identifies the handset by its PJSIP endpoint.
exten => dect-claim,1,Answer()
 same => n,Wait(0.3)
 same => n,GotoIf($["${DIAL_CLAIM_CODE}" != ""]?go)
 same => n,Gosub(dial-sound,s,1(dial/claim-enter-code,vm-enter-num-to-call))
 same => n,Read(DIAL_CLAIM_CODE,${GOSUB_RETVAL}&beep,8,,2,10)
 same => n,GotoIf($["${DIAL_CLAIM_CODE}" = ""]?bad)
 same => n(go),Gosub(dial-hook,s,1(dect-claim,event=${DIAL_EVENT}&caller=${CHANNEL(endpoint)}&callerid=${CALLERID(num)}&code=${DIAL_CLAIM_CODE}))
 same => n,GotoIf($["${DIAL_HOOK_HANDLED}" = "1"]?ok)
 same => n(bad),Gosub(dial-play,s,1(dial/claim-failed,pbx-invalid))
 same => n,Hangup()
 same => n(ok),Playback(beep)
 same => n,Gosub(dial-play,s,1(dial/claim-ok,auth-thankyou))
 same => n,SayDigits(${JSON_DECODE(DIAL_HOOK_RESULT,number)})
 same => n,Wait(0.5)
 same => n,Hangup()

; --- record an announcement by phone: <announcement_record_number>[<code>] ---
; Reached via the plan's recording number (code read via DTMF) or <number><code> en bloc (realtime row sets
; DIAL_RECORD_CODE). Flow: announcement-record-start hook validates code + caller and returns
;   {"handled": true, "number": "4801", "name": "demo-4801-20260914-101500", "file": "<DIAL_RECORDING_DIR>/<name>"}
; The wav is written to ${file}.wav - or, when the DIAL_RECORD_DIR environment variable is set on this box,
; to ${DIAL_RECORD_DIR}/<name>.wav (use it when Asterisk and DIAL do not share the `recordings` volume).
; Afterwards announcement-recorded posts event, code, file (with .wav), duration; DIAL imports the file when it
; can read it (shared volume) or keeps the path as playback reference. Hanging up during Record() keeps the file
; (option k) and the hangup handler still posts announcement-recorded.
exten => record-announcement,1,Answer()
 same => n,Wait(0.3)
 same => n,GotoIf($["${DIAL_RECORD_CODE}" != ""]?go)
 same => n,Gosub(dial-sound,s,1(dial/record-enter-code,vm-enter-num-to-call))
 same => n,Read(DIAL_RECORD_CODE,${GOSUB_RETVAL}&beep,8,,2,10)
 same => n,GotoIf($["${DIAL_RECORD_CODE}" = ""]?bad)
 same => n(go),Gosub(dial-hook,s,1(announcement-record-start,event=${DIAL_EVENT}&caller=${CHANNEL(endpoint)}&callerid=${CALLERID(num)}&code=${DIAL_RECORD_CODE}))
 same => n,GotoIf($["${DIAL_HOOK_HANDLED}" = "1"]?ok)
 same => n(bad),Gosub(dial-play,s,1(dial/record-failed,pbx-invalid))
 same => n,Hangup()
 same => n(ok),Set(DIAL_REC_FILE=${JSON_DECODE(DIAL_HOOK_RESULT,file)})
 same => n,Set(DIAL_REC_DIR=${ENV(DIAL_RECORD_DIR)})
 same => n,ExecIf($["${DIAL_REC_DIR}" != ""]?Set(DIAL_REC_FILE=${DIAL_REC_DIR}/${JSON_DECODE(DIAL_HOOK_RESULT,name)}))
 same => n,System(mkdir -p ${SHELL_ESCAPE(${DIRNAME(${DIAL_REC_FILE})})})
 same => n,Set(DIAL_REC_SAVED=0)
 same => n,Set(CHANNEL(hangup_handler_push)=dial-record-hangup,s,1)
 same => n,Gosub(dial-play,s,1(dial/record-intro,vm-intro))
 same => n,Set(DIAL_REC_START=${EPOCH})
 same => n,Playback(beep)
 same => n,Record(${DIAL_REC_FILE}.wav,3,120,k)
 same => n,Set(DIAL_REC_DURATION=$[${EPOCH} - ${DIAL_REC_START}])
 same => n,Wait(0.5)
 same => n,Playback(${DIAL_REC_FILE})
 same => n,Gosub(dial-record-save,s,1)
 same => n,GotoIf($["${DIAL_HOOK_HANDLED}" = "1"]?saved)
 same => n,Gosub(dial-play,s,1(dial/record-failed,pbx-invalid))
 same => n,Hangup()
 same => n(saved),Gosub(dial-play,s,1(dial/record-ok,auth-thankyou))
 same => n,Wait(0.5)
 same => n,Hangup()

; --- emergency fallback announcement ---
exten => emergency-fallback,1,Answer()
 same => n,Gosub(dial-play,s,1(dial/emergency-unavailable,ss-noservice))
 same => n,Hangup()

exten => i,1,Playback(pbx-invalid)
 same => n,Hangup()
exten => h,1,NoOp()

; Gosub(dial-record-save,s,1) - tell DIAL about a finished announcement recording (once)
[dial-record-save]
exten => s,1,GotoIf($["${DIAL_REC_SAVED}" = "1" | "${DIAL_REC_FILE}" = ""]?done)
 same => n,ExecIf($["${DIAL_REC_DURATION}" = "" & "${DIAL_REC_START}" != ""]?Set(DIAL_REC_DURATION=$[${EPOCH} - ${DIAL_REC_START}]))
 same => n,Gosub(dial-hook,s,1(announcement-recorded,event=${DIAL_EVENT}&code=${DIAL_RECORD_CODE}&file=${DIAL_REC_FILE}.wav&duration=${DIAL_REC_DURATION}))
 same => n,ExecIf($["${DIAL_HOOK_HANDLED}" = "1"]?Set(DIAL_REC_SAVED=1))
 same => n(done),Return()

; hangup handler pushed by record-announcement: the caller hung up while/after recording - still save it
[dial-record-hangup]
exten => s,1,GotoIf($["${DIAL_REC_START}" = ""]?done)
 same => n,Gosub(dial-record-save,s,1)
 same => n(done),Return()
