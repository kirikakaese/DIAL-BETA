; PET - extensions.conf (static part)
;
; Per-event routing lives in the realtime table `extensions` (context pet-<slug>), written by
; apps.pbx.backends.asterisk. Each event needs a tiny static *shell* context
;
;     [pet-demo]
;     include => pet-internal
;     switch => Realtime/@
;
; so that pbx_realtime is consulted for that context name. Shell contexts are pulled from PET
; (GET /api/v1/pbx/dialplan/?shell=1) by the #exec below at load/`dialplan reload` time, falling
; back to the PET_EVENTS environment variable when PET is unreachable.
;
; Call flow for a DECT/SIP extension 4242 in event demo (rows written by PET):
;   PJSIP/demo-aaaa dials 4242 -> endpoint context pet-demo -> realtime rows:
;   Set(__PET_EVENT=demo) Set(PET_EXTEN=4242) Set(PET_ALLOW_CB=1) Set(PET_PRIORITY=0)
;   Set(CHANNEL(hangup_handler_push)=pet-hangup,s,1) Dial(PJSIP/x&PJSIP/y,30,tT) -> busy/noanswer branches
;   On hangup [pet-hangup] tells PET both numbers are idle again (CCBS).

[general]
static=yes
writeprotect=yes
clearglobalvars=no
autofallthrough=yes
extenpatternmatchnew=no

[globals]
PET_API=${PET_API_URL}
PET_SECRET=${PET_PBX_HOOK_SECRET}
PET_EMERGENCY_FALLBACK_NUM=${PET_EMERGENCY_FALLBACK}
PET_CDR_HOOK_ENABLED=${PET_CDR_HOOK}
PET_DEFAULT_TIMEOUT=30

;================================================================================================
; Event shell contexts ([pet-<slug>]) - generated
;================================================================================================
#exec /opt/pet/scripts/pet_contexts.sh

;================================================================================================
; Helpers
;================================================================================================
; Gosub(pet-sound,s,1(<preferred>,<fallback>)) -> ${GOSUB_RETVAL} = first sound file that exists.
; Custom PET prompts live in /var/lib/asterisk/sounds/pet/ (volume); until recorded, core sounds are used.
[pet-sound]
exten => s,1,Set(PET_S_BASE=/var/lib/asterisk/sounds)
 same => n,GotoIf($[${STAT(e,${PET_S_BASE}/${ARG1}.wav)} | ${STAT(e,${PET_S_BASE}/${ARG1}.gsm)} | ${STAT(e,${PET_S_BASE}/${ARG1}.sln)} | ${STAT(e,${PET_S_BASE}/${ARG1}.sln16)} | ${STAT(e,${PET_S_BASE}/${CHANNEL(language)}/${ARG1}.wav)} | ${STAT(e,${PET_S_BASE}/${CHANNEL(language)}/${ARG1}.gsm)}]?found)
 same => n,Return(${ARG2})
 same => n(found),Return(${ARG1})

; Gosub(pet-play,s,1(<preferred>,<fallback>)) - Playback with fallback
[pet-play]
exten => s,1,Gosub(pet-sound,s,1(${ARG1},${ARG2}))
 same => n,Playback(${GOSUB_RETVAL})
 same => n,Return()

; Configure CURL() for talking to PET (auth header + short timeouts so a dead PET never hangs a call)
[pet-curl]
exten => s,1,Set(CURLOPT(httpheader)=X-PET-PBX-Secret: ${PET_SECRET})
 same => n,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(dnstimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=8)
 same => n,Set(CURLOPT(failurecodes)=yes)
 same => n,Return()

; Gosub(pet-hook,s,1(<kind>,<form-data>)) -> PET_HOOK_RESULT (raw JSON), PET_HOOK_HANDLED (1/0)
[pet-hook]
exten => s,1,Gosub(pet-curl,s,1)
 same => n,Set(PET_HOOK_RESULT=${CURL(${PET_API}/api/v1/pbx/hooks/${ARG1}/,${ARG2})})
 same => n,Set(PET_HOOK_HANDLED=${JSON_DECODE(PET_HOOK_RESULT,handled)})
 same => n,ExecIf($["${PET_HOOK_HANDLED}" = "true" | "${PET_HOOK_HANDLED}" = "1"]?Set(PET_HOOK_HANDLED=1):Set(PET_HOOK_HANDLED=0))
 same => n,Return()

; Gosub(pet-lookup,s,1(<number>)) -> PET_ROUTE (raw JSON) + PET_R_* convenience variables
[pet-lookup]
exten => s,1,Gosub(pet-curl,s,1)
 same => n,Set(PET_ROUTE=${CURL(${PET_API}/api/v1/pbx/route/?event=${PET_EVENT}&number=${URIENCODE(${ARG1})})})
 same => n,Set(PET_R_TYPE=${JSON_DECODE(PET_ROUTE,type)})
 same => n,Set(PET_R_DIAL=${JSON_DECODE(PET_ROUTE,dial_string)})
 same => n,Set(PET_R_STRATEGY=${JSON_DECODE(PET_ROUTE,strategy)})
 same => n,Set(PET_R_TIMEOUT=${JSON_DECODE(PET_ROUTE,timeout)})
 same => n,Set(PET_R_FWD_BUSY=${JSON_DECODE(PET_ROUTE,forward_busy)})
 same => n,Set(PET_R_FWD_NA=${JSON_DECODE(PET_ROUTE,forward_noanswer)})
 same => n,Set(PET_R_FWD_UNCOND=${JSON_DECODE(PET_ROUTE,forward_unconditional)})
 same => n,ExecIf($["${PET_R_TIMEOUT}" = "" | "${PET_R_TIMEOUT}" = "null"]?Set(PET_R_TIMEOUT=${PET_DEFAULT_TIMEOUT}))
 same => n,ExecIf($["${PET_R_TYPE}" = "null"]?Set(PET_R_TYPE=))
 same => n,ExecIf($["${PET_R_DIAL}" = "null"]?Set(PET_R_DIAL=))
 same => n,Return()

; Gosub(pet-dial,s,1(<dial-string a&b&c>,<strategy>,<timeout>)) - ring targets in parallel or serially
[pet-dial]
exten => s,1,NoOp(PET dial ${ARG1} strategy=${ARG2} timeout=${ARG3})
 same => n,Set(PET_D_TIMEOUT=${IF($["${ARG3}" = ""]?${PET_DEFAULT_TIMEOUT}:${ARG3})})
 same => n,GotoIf($["${ARG1}" = ""]?none)
 same => n,GotoIf($["${ARG2}" = "serial"]?serial)
 same => n,Dial(${ARG1},${PET_D_TIMEOUT},tT)
 same => n,Return()
 same => n(serial),Set(PET_D_I=1)
 same => n(loop),Set(PET_D_T=${CUT(ARG1,&,${PET_D_I})})
 same => n,GotoIf($["${PET_D_T}" = ""]?exhausted)
 same => n,Dial(${PET_D_T},${PET_D_TIMEOUT},tT)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?exhausted)
 same => n,Set(PET_D_I=$[${PET_D_I} + 1])
 same => n,Goto(loop)
 same => n(exhausted),Return()
 same => n(none),Set(DIALSTATUS=CHANUNAVAIL)
 same => n,Return()

; Gosub(pet-after-dial,s,1(<fwd_busy>,<fwd_noanswer>)) - apply forwards after an unsuccessful Dial
[pet-after-dial]
exten => s,1,NoOp(PET after dial: ${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${ARG2}" != ""]?fwdna)
 same => n,Playback(vm-nobodyavail)
 same => n,Hangup()
 same => n(fwdna),Goto(pet-${PET_EVENT},${ARG2},1)
 same => n(busy),GotoIf($["${ARG1}" != ""]?fwdbusy)
 same => n,Busy(10)
 same => n,Hangup()
 same => n(fwdbusy),Goto(pet-${PET_EVENT},${ARG1},1)

;================================================================================================
; Generic fallbacks included by every [pet-<slug>] shell context (checked AFTER the realtime rows)
;================================================================================================
[pet-internal]
; anything PET has no realtime row for: ask the route API (emergency / federation / breakout)
exten => _[0-9*#].,1,NoOp(PET: ${EXTEN} not in realtime rows of pet-${PET_EVENT} - asking PET)
 same => n,Set(CHANNEL(hangup_handler_push)=pet-hangup,s,1)
 same => n,Gosub(pet-route,s,1(${EXTEN}))
 same => n,Hangup()
exten => i,1,Playback(pbx-invalid)
 same => n,Hangup()
exten => t,1,Hangup()
exten => h,1,NoOp()

; Gosub(pet-route,s,1(<number>)): route whatever PET says (used for unknown numbers,
; federation and breakout extension types)
[pet-route]
exten => s,1,Gosub(pet-lookup,s,1(${ARG1}))
 same => n,GotoIf($["${PET_R_TYPE}" = "emergency"]?emergency)
 same => n,GotoIf($["${PET_R_DIAL}" = ""]?invalid)
 same => n,Gosub(pet-dial,s,1(${PET_R_DIAL},${PET_R_STRATEGY},${PET_R_TIMEOUT}))
 same => n,Gosub(pet-after-dial,s,1(${PET_R_FWD_BUSY},${PET_R_FWD_NA}))
 same => n,Return()
 same => n(emergency),Goto(pet-emergency,${ARG1},1)
 same => n(invalid),Playback(pbx-invalid)
 same => n,Return()

;================================================================================================
; Hangup handler: tell PET both parties are idle again (fires pending CCBS/CCNR callbacks)
;================================================================================================
[pet-hangup]
exten => s,1,NoOp(PET hangup ${CHANNEL} dialstatus=${DIALSTATUS} cause=${HANGUPCAUSE})
 same => n,GotoIf($["${PET_EVENT}" = ""]?done)
 same => n,Gosub(pet-curl,s,1)
 same => n,ExecIf($["${CALLERID(num)}" != ""]?Set(PET_R1=${CURL(${PET_API}/api/v1/pbx/hooks/extension-idle/,event=${PET_EVENT}&number=${URIENCODE(${CALLERID(num)})}&channel=${URIENCODE(${CHANNEL})})}))
 same => n,ExecIf($["${PET_EXTEN}" != "" & "${PET_EXTEN}" != "${CALLERID(num)}"]?Set(PET_R2=${CURL(${PET_API}/api/v1/pbx/hooks/extension-idle/,event=${PET_EVENT}&number=${URIENCODE(${PET_EXTEN})}&channel=${URIENCODE(${CHANNEL})})}))
 same => n,GotoIf($["${PET_CDR_HOOK_ENABLED}" != "yes"]?done)
 same => n,Set(PET_R3=${CURL(${PET_API}/api/v1/pbx/hooks/cdr/,event=${PET_EVENT}&src=${URIENCODE(${CDR(src)})}&dst=${URIENCODE(${CDR(dst)})}&start=${URIENCODE(${CDR(start)})}&answer=${URIENCODE(${CDR(answer)})}&end=${URIENCODE(${CDR(end)})}&duration=${CDR(duration)}&billsec=${CDR(billsec)}&disposition=${CDR(disposition)}&channel=${URIENCODE(${CDR(channel)})}&dstchannel=${URIENCODE(${CDR(dstchannel)})}&uniqueid=${URIENCODE(${CDR(uniqueid)})}&dcontext=${CDR(dcontext)}&accountcode=${CDR(accountcode)})})
 same => n(done),Return()

;================================================================================================
; Feature codes: Gosub(pet-feature,s,1(<code>,<target>)) from realtime rows *66 / _*66.
;================================================================================================
[pet-feature]
exten => s,1,NoOp(PET feature code ${ARG1} target=${ARG2} from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.3)
 same => n,Gosub(pet-hook,s,1(feature-code,event=${PET_EVENT}&caller=${CALLERID(num)}&code=${ARG1}&target=${ARG2}))
 same => n,GotoIf($["${PET_HOOK_HANDLED}" = "1"]?ok)
 same => n,Playback(pbx-invalid)
 same => n,Return()
 same => n(ok),Playback(beep)
 same => n,Playback(auth-thankyou)
 same => n,Return()

;================================================================================================
; Groups: Gosub(pet-group,s,1(<group number>)) - members come from the route API
;
; Optional extras in the route JSON (ignored when absent, so older PET versions keep working):
;   callerid_prefix   "[SEC] "  -> prepended to the caller name so members see which group rings
;   dial_string_waves "PJSIP/a&Local/005*4300@pet-group" -> ring-all with per-member ring delays;
;                     delayed legs are Local channels into the _XXX*X. exten below (<delay>*<number>)
;================================================================================================
[pet-group]
exten => s,1,NoOp(PET group ${ARG1})
 same => n,Gosub(pet-lookup,s,1(${ARG1}))
 same => n,GotoIf($["${PET_R_FWD_UNCOND}" != ""]?uncond)
 same => n,Set(PET_G_PREFIX=${JSON_DECODE(PET_ROUTE,callerid_prefix)})
 same => n,ExecIf($["${PET_G_PREFIX}" = "null"]?Set(PET_G_PREFIX=))
 same => n,ExecIf($["${PET_G_PREFIX}" != ""]?Set(CALLERID(name)=${PET_G_PREFIX}${CALLERID(name)}))
 same => n,Set(PET_G_WAVES=${JSON_DECODE(PET_ROUTE,dial_string_waves)})
 same => n,ExecIf($["${PET_G_WAVES}" = "null"]?Set(PET_G_WAVES=))
 same => n,ExecIf($["${PET_G_WAVES}" != "" & "${PET_R_STRATEGY}" != "serial"]?Set(PET_R_DIAL=${PET_G_WAVES}))
 same => n,GotoIf($["${PET_R_DIAL}" = ""]?nobody)
 same => n,Gosub(pet-dial,s,1(${PET_R_DIAL},${PET_R_STRATEGY},${PET_R_TIMEOUT}))
 same => n,Gosub(pet-after-dial,s,1(${PET_R_FWD_BUSY},${PET_R_FWD_NA}))
 same => n,Return()
 same => n(uncond),Goto(pet-${PET_EVENT},${PET_R_FWD_UNCOND},1)
 same => n(nobody),GotoIf($["${PET_R_FWD_NA}" != ""]?fwd)
 same => n,Answer()
 same => n,Playback(vm-nobodyavail)
 same => n,Return()
 same => n(fwd),Goto(pet-${PET_EVENT},${PET_R_FWD_NA},1)
; Delayed ring-all leg: Local/<delay, 3 digits>*<member number>@pet-group. Waits, then rings the member
; through its normal route in the event context. The outer Dial() tears this leg down when someone
; else answers or the group timeout expires, so the inner timeout only needs to be generous.
exten => _XXX*X.,1,NoOp(PET group delayed leg ${EXTEN})
 same => n,Wait(${CUT(EXTEN,*,1)})
 same => n,Dial(Local/${CUT(EXTEN,*,2)}@pet-${PET_EVENT},${PET_DEFAULT_TIMEOUT},tT)
 same => n,Hangup()

;================================================================================================
; Announcements + IVR menus: Gosub(pet-ivr,s,1(<number>,<announcement|ivr>))
; Route API returns ivr_greeting (sound file, e.g. pet/<uuid>), ivr_timeout, ivr_options {digit: number}
;================================================================================================
[pet-ivr]
exten => s,1,NoOp(PET ${ARG2} ${ARG1})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Gosub(pet-lookup,s,1(${ARG1}))
 same => n,Set(PET_IVR_GREETING=${JSON_DECODE(PET_ROUTE,ivr_greeting)})
 same => n,Set(PET_IVR_TIMEOUT=${JSON_DECODE(PET_ROUTE,ivr_timeout)})
 same => n,ExecIf($["${PET_IVR_GREETING}" = "" | "${PET_IVR_GREETING}" = "null"]?Set(PET_IVR_GREETING=pet/default-announcement))
 same => n,ExecIf($["${PET_IVR_TIMEOUT}" = "" | "${PET_IVR_TIMEOUT}" = "null"]?Set(PET_IVR_TIMEOUT=5))
 same => n,Gosub(pet-sound,s,1(${PET_IVR_GREETING},hello-world))
 same => n,Set(PET_IVR_GREETING=${GOSUB_RETVAL})
 same => n,GotoIf($["${ARG2}" = "announcement"]?announce)
 same => n,Set(PET_IVR_TRIES=0)
 same => n(menu),Read(PET_IVR_CHOICE,${PET_IVR_GREETING},1,,1,${PET_IVR_TIMEOUT})
 same => n,GotoIf($["${PET_IVR_CHOICE}" = ""]?retry)
 same => n,Set(PET_IVR_TARGET=${JSON_DECODE(PET_ROUTE,ivr_options.${PET_IVR_CHOICE})})
 same => n,GotoIf($["${PET_IVR_TARGET}" = "" | "${PET_IVR_TARGET}" = "null"]?invalid)
 same => n,Goto(pet-${PET_EVENT},${PET_IVR_TARGET},1)
 same => n(invalid),Playback(pbx-invalid)
 same => n(retry),Set(PET_IVR_TRIES=$[${PET_IVR_TRIES} + 1])
 same => n,GotoIf($[${PET_IVR_TRIES} < 3]?menu)
 same => n,Playback(vm-goodbye)
 same => n,Return()
 same => n(announce),Playback(${PET_IVR_GREETING})
 same => n,Wait(0.5)
 same => n,Return()

;================================================================================================
; Application extensions: Gosub(pet-app,s,1(<app>)) -> extension <app> in [pet-services]
;================================================================================================
[pet-app]
exten => s,1,NoOp(PET app ${ARG1})
 same => n,GotoIf(${DIALPLAN_EXISTS(pet-services,${ARG1},1)}?pet-services,${ARG1},1)
 same => n,Playback(pbx-invalid)
 same => n,Return()

;================================================================================================
; Emergency numbers (112/110/911...): realtime rows Goto here; PET may supply a route
;================================================================================================
[pet-emergency]
exten => _[0-9].,1,NoOp(***** EMERGENCY ${EXTEN} from ${CALLERID(all)} event=${PET_EVENT} *****)
 same => n,Set(PET_PRIORITY=100)
 same => n,Set(CHANNEL(hangup_handler_push)=pet-hangup,s,1)
 same => n,Gosub(pet-lookup,s,1(${EXTEN}))
 same => n,GotoIf($["${PET_R_DIAL}" = ""]?fallback)
 same => n,Dial(${PET_R_DIAL},90,tT)
 same => n(fallback),GotoIf($["${PET_EMERGENCY_FALLBACK_NUM}" = ""]?none)
 same => n,Dial(Local/${PET_EMERGENCY_FALLBACK_NUM}@pet-${PET_EVENT},90,tT)
 same => n(none),Answer()
 same => n,Gosub(pet-play,s,1(pet/emergency-unavailable,ss-noservice))
 same => n,Hangup()

;================================================================================================
; Services. Reached via realtime rows (Goto(pet-services,<svc>,1)) for the plan's service numbers,
; via Gosub(pet-app,...) for `app` extensions, and as the *originate* target of AsteriskPBX.originate():
;   POST /ari/channels endpoint=Local/<dest>@pet-<slug> context=pet-services extension=${PET_SERVICE}
;================================================================================================
[pet-services]
; --- echo test (echo_test_number) ---
exten => echo,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; --- time announcement ---
exten => time,1,Answer()
 same => n,Wait(0.5)
 same => n,SayUnixTime(,,kM)
 same => n,Wait(0.5)
 same => n,Hangup()

; --- music on hold test ---
exten => moh,1,Answer()
 same => n,MusicOnHold(default,120)
 same => n,Hangup()

; --- hello world / generic announcement (PET_ANNOUNCEMENT = sound file) ---
exten => hello,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()
exten => announce,1,NoOp(PET announcement ${PET_ANNOUNCEMENT} priority=${PET_PRIORITY})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,GotoIf($["${PET_ANNOUNCEMENT}" != ""]?custom)
 same => n,Gosub(pet-play,s,1(pet/default-announcement,hello-world))
 same => n,Goto(done)
 same => n(custom),Gosub(pet-play,s,1(${PET_ANNOUNCEMENT},hello-world))
 same => n(done),Wait(0.5)
 same => n,Hangup()

; --- test ringback: user dials test_ringback_number; PET calls back after a delay ---
exten => ringback-request,1,Answer()
 same => n,Wait(0.3)
 same => n,Gosub(pet-hook,s,1(feature-code,event=${PET_EVENT}&caller=${CALLERID(num)}&code=ringback&target=${CALLERID(num)}))
 same => n,GotoIf($["${PET_HOOK_HANDLED}" = "1"]?ok)
 same => n,Playback(pbx-invalid)
 same => n,Hangup()
 same => n(ok),Playback(beep)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()
; originate target: callee answered -> beep + announcement
exten => ringback,1,NoOp(PET test ringback delivered to ${PET_DESTINATION})
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Gosub(pet-play,s,1(${IF($["${PET_ANNOUNCEMENT}" != ""]?${PET_ANNOUNCEMENT}:pet/ringback-ok)},demo-congrats))
 same => n,SayDigits(${PET_DESTINATION})
 same => n,Wait(0.5)
 same => n,Hangup()

; --- wake-up call: user dials wakeup_service_number and enters HHMM ---
exten => wakeup,1,Answer()
 same => n,Wait(0.3)
 same => n,Gosub(pet-sound,s,1(pet/wakeup-enter-time,vm-enter-num-to-call))
 same => n,Read(PET_WAKE,${GOSUB_RETVAL}&beep,4,,2,10)
 same => n,GotoIf($["${LEN(${PET_WAKE})}" != "4"]?bad)
 same => n,Gosub(pet-hook,s,1(feature-code,event=${PET_EVENT}&caller=${CALLERID(num)}&code=wakeup&target=${PET_WAKE}))
 same => n,GotoIf($["${PET_HOOK_HANDLED}" = "1"]?ok)
 same => n(bad),Playback(pbx-invalid)
 same => n,Hangup()
 same => n(ok),Playback(beep)
 same => n,SayNumber(${PET_WAKE:0:2})
 same => n,SayNumber(${PET_WAKE:2:2})
 same => n,Playback(auth-thankyou)
 same => n,Hangup()
; originate target of the wake-up call itself
exten => wakeup-call,1,NoOp(PET wake-up call to ${PET_DESTINATION})
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Gosub(pet-play,s,1(${IF($["${PET_ANNOUNCEMENT}" != ""]?${PET_ANNOUNCEMENT}:pet/wakeup-call)},hello-world))
 same => n,SayUnixTime(,,kM)
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,Hangup()

; --- callback delivery (CCBS/CCNR): PET originates to the requester, then bridges to the target ---
exten => callback,1,NoOp(PET callback ${PET_DESTINATION} -> ${PET_CALLBACK_TARGET})
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,GotoIf($["${PET_CALLBACK_TARGET}" = ""]?none)
 same => n,Gosub(pet-play,s,1(pet/callback-connecting,transfer))
 same => n,Set(__PET_EVENT=${PET_EVENT})
 same => n,Set(CALLERID(num)=${PET_DESTINATION})
 same => n,Dial(Local/${PET_CALLBACK_TARGET}@pet-${PET_EVENT},${IF($["${PET_TIMEOUT}" != ""]?${PET_TIMEOUT}:45)},tTg)
 same => n,Hangup()
 same => n(none),Playback(pbx-invalid)
 same => n,Hangup()

; --- DECT site survey: announce the RFP the caller is currently on, every few seconds ---
exten => survey,1,Answer()
 same => n,Wait(0.5)
 same => n,Gosub(pet-play,s,1(pet/survey-start,beep))
 same => n,Set(PET_SURVEY_LAST=)
 same => n(loop),Gosub(pet-hook,s,1(site-survey,event=${PET_EVENT}&caller=${CALLERID(num)}))
 same => n,Set(PET_RFP=${JSON_DECODE(PET_HOOK_RESULT,say)})
 same => n,GotoIf($["${PET_RFP}" = "" | "${PET_RFP}" = "null"]?nodata)
 same => n,GotoIf($["${PET_RFP}" = "${PET_SURVEY_LAST}"]?same)
 same => n,Set(PET_SURVEY_LAST=${PET_RFP})
 same => n,Playback(beep)
 same => n,SayAlpha(${PET_RFP})
 same => n,Wait(3)
 same => n,Goto(loop)
 same => n(same),Playback(beep)
 same => n,Wait(3)
 same => n,Goto(loop)
 same => n(nodata),Playback(vm-nomore)
 same => n,Wait(3)
 same => n,Goto(loop)

; --- voicemail access (voicemail_number): own mailbox, PIN from voicemail_users ---
exten => voicemail,1,Answer()
 same => n,Wait(0.5)
 same => n,VoiceMailMain(${CALLERID(num)}@pet-${PET_EVENT})
 same => n,Hangup()

; --- DECT claim (GURU3-style): bind the calling handset to the extension whose claim code is dialled ---
; Reached via <dect_claim_number> (code is then read via DTMF) or <dect_claim_number><code> en bloc
; (the realtime row sets PET_CLAIM_CODE). The hook identifies the handset by its PJSIP endpoint.
exten => dect-claim,1,Answer()
 same => n,Wait(0.3)
 same => n,GotoIf($["${PET_CLAIM_CODE}" != ""]?go)
 same => n,Gosub(pet-sound,s,1(pet/claim-enter-code,vm-enter-num-to-call))
 same => n,Read(PET_CLAIM_CODE,${GOSUB_RETVAL}&beep,8,,2,10)
 same => n,GotoIf($["${PET_CLAIM_CODE}" = ""]?bad)
 same => n(go),Gosub(pet-hook,s,1(dect-claim,event=${PET_EVENT}&caller=${CHANNEL(endpoint)}&callerid=${CALLERID(num)}&code=${PET_CLAIM_CODE}))
 same => n,GotoIf($["${PET_HOOK_HANDLED}" = "1"]?ok)
 same => n(bad),Gosub(pet-play,s,1(pet/claim-failed,pbx-invalid))
 same => n,Hangup()
 same => n(ok),Playback(beep)
 same => n,Gosub(pet-play,s,1(pet/claim-ok,auth-thankyou))
 same => n,SayDigits(${JSON_DECODE(PET_HOOK_RESULT,number)})
 same => n,Wait(0.5)
 same => n,Hangup()

; --- record an announcement by phone: <announcement_record_number>[<code>] ---
; Reached via the plan's recording number (code read via DTMF) or <number><code> en bloc (realtime row sets
; PET_RECORD_CODE). Flow: announcement-record-start hook validates code + caller and returns
;   {"handled": true, "number": "4801", "name": "demo-4801-20260914-101500", "file": "<PET_RECORDING_DIR>/<name>"}
; The wav is written to ${file}.wav - or, when the PET_RECORD_DIR environment variable is set on this box,
; to ${PET_RECORD_DIR}/<name>.wav (use it when Asterisk and PET do not share the `recordings` volume).
; Afterwards announcement-recorded posts event, code, file (with .wav), duration; PET imports the file when it
; can read it (shared volume) or keeps the path as playback reference. Hanging up during Record() keeps the file
; (option k) and the hangup handler still posts announcement-recorded.
exten => record-announcement,1,Answer()
 same => n,Wait(0.3)
 same => n,GotoIf($["${PET_RECORD_CODE}" != ""]?go)
 same => n,Gosub(pet-sound,s,1(pet/record-enter-code,vm-enter-num-to-call))
 same => n,Read(PET_RECORD_CODE,${GOSUB_RETVAL}&beep,8,,2,10)
 same => n,GotoIf($["${PET_RECORD_CODE}" = ""]?bad)
 same => n(go),Gosub(pet-hook,s,1(announcement-record-start,event=${PET_EVENT}&caller=${CHANNEL(endpoint)}&callerid=${CALLERID(num)}&code=${PET_RECORD_CODE}))
 same => n,GotoIf($["${PET_HOOK_HANDLED}" = "1"]?ok)
 same => n(bad),Gosub(pet-play,s,1(pet/record-failed,pbx-invalid))
 same => n,Hangup()
 same => n(ok),Set(PET_REC_FILE=${JSON_DECODE(PET_HOOK_RESULT,file)})
 same => n,Set(PET_REC_DIR=${ENV(PET_RECORD_DIR)})
 same => n,ExecIf($["${PET_REC_DIR}" != ""]?Set(PET_REC_FILE=${PET_REC_DIR}/${JSON_DECODE(PET_HOOK_RESULT,name)}))
 same => n,System(mkdir -p ${SHELL_ESCAPE(${DIRNAME(${PET_REC_FILE})})})
 same => n,Set(PET_REC_SAVED=0)
 same => n,Set(CHANNEL(hangup_handler_push)=pet-record-hangup,s,1)
 same => n,Gosub(pet-play,s,1(pet/record-intro,vm-intro))
 same => n,Set(PET_REC_START=${EPOCH})
 same => n,Playback(beep)
 same => n,Record(${PET_REC_FILE}.wav,3,120,k)
 same => n,Set(PET_REC_DURATION=$[${EPOCH} - ${PET_REC_START}])
 same => n,Wait(0.5)
 same => n,Playback(${PET_REC_FILE})
 same => n,Gosub(pet-record-save,s,1)
 same => n,GotoIf($["${PET_HOOK_HANDLED}" = "1"]?saved)
 same => n,Gosub(pet-play,s,1(pet/record-failed,pbx-invalid))
 same => n,Hangup()
 same => n(saved),Gosub(pet-play,s,1(pet/record-ok,auth-thankyou))
 same => n,Wait(0.5)
 same => n,Hangup()

; --- emergency fallback announcement ---
exten => emergency-fallback,1,Answer()
 same => n,Gosub(pet-play,s,1(pet/emergency-unavailable,ss-noservice))
 same => n,Hangup()

exten => i,1,Playback(pbx-invalid)
 same => n,Hangup()
exten => h,1,NoOp()

; Gosub(pet-record-save,s,1) - tell PET about a finished announcement recording (once)
[pet-record-save]
exten => s,1,GotoIf($["${PET_REC_SAVED}" = "1" | "${PET_REC_FILE}" = ""]?done)
 same => n,ExecIf($["${PET_REC_DURATION}" = "" & "${PET_REC_START}" != ""]?Set(PET_REC_DURATION=$[${EPOCH} - ${PET_REC_START}]))
 same => n,Gosub(pet-hook,s,1(announcement-recorded,event=${PET_EVENT}&code=${PET_RECORD_CODE}&file=${PET_REC_FILE}.wav&duration=${PET_REC_DURATION}))
 same => n,ExecIf($["${PET_HOOK_HANDLED}" = "1"]?Set(PET_REC_SAVED=1))
 same => n(done),Return()

; hangup handler pushed by record-announcement: the caller hung up while/after recording - still save it
[pet-record-hangup]
exten => s,1,GotoIf($["${PET_REC_START}" = ""]?done)
 same => n,Gosub(pet-record-save,s,1)
 same => n(done),Return()
