; PET - sorcery.conf: PJSIP objects come from the realtime tables.
[res_pjsip]
endpoint=realtime,ps_endpoints
auth=realtime,ps_auths
aor=realtime,ps_aors
; registrations are persisted by Asterisk into ps_contacts (survives restarts, visible in PET admin)
contact=realtime,ps_contacts
; static objects (transports, global, system) still come from pjsip.conf
transport=config,pjsip.conf,criteria=type=transport
global=config,pjsip.conf,criteria=type=global
system=config,pjsip.conf,criteria=type=system

[res_pjsip_endpoint_identifier_ip]
identify=realtime,ps_endpoint_id_ips
