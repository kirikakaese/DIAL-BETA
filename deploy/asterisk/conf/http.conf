; PET - http.conf: built-in HTTP server for ARI (8088) and WSS (8089)
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
prefix=
sessionlimit=100
session_inactivity=30000
session_keep_alive=15000
enablestatic=no
; TLS side - used by transport-wss (WebRTC scaffold); self-signed cert generated by entrypoint.sh
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/asterisk.pem
tlsprivatekey=/etc/asterisk/keys/asterisk.key
