; DIAL - cdr_adaptive_odbc.conf: one row per call into the `cdr` table (apps.pbx.models.Cdr).
; cdr_adaptive_odbc only fills the columns that exist, so the Django-side `id`/`ingested_at`
; columns are simply left alone. "end" is a reserved word -> quote identifiers.
[dial]
connection=asterisk
table=cdr
quoted_identifiers="
usegmtime=yes
; accountcode is set to the event slug on every endpoint (see AsteriskPBX.sync_device)
; so DIAL can attribute records to events. Uncomment to only store answered calls:
;filter disposition => ANSWERED
