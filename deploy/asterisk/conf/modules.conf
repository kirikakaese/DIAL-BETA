; MWI note: app_voicemail owns MWI for the mailboxes it records. If you want PET to
; drive MWI via ARI (AsteriskPBX.set_mwi -> PUT /mailboxes/...), flip this around:
;   noload => app_voicemail.so
;   load   => res_mwi_external.so
;   load   => res_ari_mailboxes.so
; and record messages with Record() instead of VoiceMail() in the dialplan.
