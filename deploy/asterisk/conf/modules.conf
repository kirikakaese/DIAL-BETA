; PET - modules.conf
; autoload everything, but make sure the realtime/ODBC stack is up before anything that needs it.
[modules]
autoload = yes

; ODBC + realtime must be present before res_pjsip / pbx_realtime / app_voicemail load
preload => res_odbc.so
preload => res_config_odbc.so
preload => res_curl.so
preload => func_curl.so
preload => func_json.so

load => res_pjsip.so
load => res_pjsip_endpoint_identifier_ip.so
load => res_pjsip_transport_websocket.so
load => pbx_realtime.so
load => pbx_config.so
load => cdr_adaptive_odbc.so
load => app_confbridge.so
load => app_voicemail.so
load => res_ari.so
load => res_ari_channels.so
load => res_ari_endpoints.so
load => res_ari_device_states.so
load => res_ari_asterisk.so
load => res_http_websocket.so
load => res_musiconhold.so
load => func_devstate.so
load => func_realtime.so
load => func_cut.so
load => func_strings.so
load => func_logic.so
load => app_originate.so
load => app_read.so
load => app_sayunixtime.so
load => app_echo.so
load => app_authenticate.so
load => app_dial.so
load => app_stack.so

; Not needed / conflicting
noload => chan_sip.so
noload => chan_alsa.so
noload => chan_oss.so
noload => chan_console.so
noload => chan_mgcp.so
noload => chan_skinny.so
