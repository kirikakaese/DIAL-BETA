; PET - res_odbc.conf: connection pool to the PET PostgreSQL database
[asterisk]
enabled => yes
dsn => asterisk
username => ${DB_USER}
password => ${DB_PASSWORD}
pre-connect => yes
max_connections => 10
connect_timeout => 5
negative_connection_cache => 10
sanitysql => select 1
forcecommit => yes
isolation => read_committed
