; PET - musiconhold.conf
; Distro package asterisk-moh-opsound-gsm ships the files in /usr/share/asterisk/moh
[default]
mode=files
directory=moh
sort=random

; Drop your own music (wav/gsm/mp3 with asterisk-mp3) into /var/lib/asterisk/sounds/pet/moh
[pet]
mode=files
directory=/var/lib/asterisk/sounds/pet/moh
sort=random

; Custom per-extension ringback tones (Dial option m(pet-<slug>-<number>) in the generated dialplan).
; PET renders one [pet-<slug>-<number>] class per ready tone via AsteriskPBX.render_musiconhold(event)
; (mode=files, directory=<MEDIA_ROOT>/ringback/processed/<extension id>/). Write that output to
; /etc/asterisk/pet-moh.conf (the media directory must be readable by Asterisk) and run "moh reload".
#include pet-moh.conf
