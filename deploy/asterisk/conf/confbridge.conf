; DIAL - confbridge.conf: profiles referenced by realtime rows
;   ConfBridge(dial-<slug>-<number>,dial_bridge,dial_user)
[general]

[dial_bridge]
type=bridge
max_members=50
record_conference=no
internal_sample_rate=auto
mixing_interval=20
video_mode=none
language=en

[dial_user]
type=user
announce_user_count=yes
announce_join_leave=yes
announce_only_user=yes
music_on_hold_when_empty=yes
music_on_hold_class=default
dsp_drop_silence=yes
talk_detection_events=no
quiet=no
dtmf_passthrough=no

[dial_admin]
type=user
admin=yes
marked=yes
announce_user_count=yes
announce_join_leave=yes
music_on_hold_when_empty=no
dtmf_passthrough=no
