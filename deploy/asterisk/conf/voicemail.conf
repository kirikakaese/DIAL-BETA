; DIAL - voicemail.conf
; Mailboxes are realtime rows (voicemail_users: context=dial-<slug>, mailbox=<number>) written by DIAL,
; see extconfig.conf. Messages are stored on disk under /var/spool/asterisk/voicemail/<context>/<mailbox>/
; (mount it as a volume shared with DIAL so apps.voicemail can serve the files).
[general]
format=wav49|gsm|wav
serveremail=dial@dial.local
attach=no
maxmsg=50
maxsecs=180
minsecs=2
maxgreet=60
skipms=3000
maxsilence=8
silencethreshold=128
maxlogins=3
review=no
operator=no
envelope=yes
saycid=yes
sendvoicemail=no
searchcontexts=yes
pollmailboxes=yes
pollfreq=30
; externnotify is called as: <script> <context> <mailbox> <new> <old> <urgent>
; the script POSTs the newest message to DIAL's `voicemail` hook
externnotify=/opt/dial/scripts/vm_notify.sh
; --- optional ODBC storage of the audio blobs instead of files ---
;odbcstorage=asterisk
;odbctable=voicemessages

[zonemessages]
eu=Europe/Berlin|'vm-received' Q 'digits/at' kM
