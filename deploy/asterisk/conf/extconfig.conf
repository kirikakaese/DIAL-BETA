; DIAL - extconfig.conf: which Asterisk families live in the DIAL PostgreSQL database.
; Format: <family> => <driver>,<res_odbc section>[,<table>]
; The tables are Django models in apps/pbx/models.py (see deploy/asterisk/README.md).
[settings]
ps_endpoints => odbc,asterisk,ps_endpoints
ps_auths => odbc,asterisk,ps_auths
ps_aors => odbc,asterisk,ps_aors
ps_contacts => odbc,asterisk,ps_contacts
ps_endpoint_id_ips => odbc,asterisk,ps_endpoint_id_ips
; realtime dialplan (pbx_realtime: "switch => Realtime/@" in each [dial-<slug>] shell context)
extensions => odbc,asterisk,extensions
; app_voicemail mailboxes (context = dial-<slug>, mailbox = extension number)
voicemail => odbc,asterisk,voicemail_users
; NOTE: music-on-hold classes for custom ringback tones are *not* realtime - they come from the static
; dial-moh.conf that musiconhold.conf includes (see AsteriskPBX.render_musiconhold).
