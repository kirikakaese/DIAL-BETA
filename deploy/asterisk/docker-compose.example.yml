# Example compose fragment for the DIAL reference Asterisk. Merge into your main docker-compose.yml.
# DIAL (web + celery worker) must share the same PostgreSQL database - Asterisk reads/writes the
# realtime tables (ps_endpoints, ps_auths, ps_aors, ps_contacts, extensions, voicemail_users, cdr)
# that are Django models in apps/pbx/models.py. Run `manage.py migrate` before starting Asterisk.
#
# This is the "shared database" variant. For a venue box WITHOUT database access to the central DIAL
# (local PostgreSQL fed by deploy/venue-agent over HTTPS) see docker-compose.venue.example.yml.
services:
  asterisk:
    build: ./deploy/asterisk
    restart: unless-stopped
    depends_on:
      - db
      - dial
    environment:
      DIAL_API_URL: http://dial:8000
      DIAL_PBX_HOOK_SECRET: ${DIAL_PBX_HOOK_SECRET:-change-me}
      DIAL_EVENTS: ${DIAL_EVENTS:-}          # fallback shell contexts if DIAL is down at boot, e.g. "demo,camp2026"
      DIAL_EMERGENCY_FALLBACK: ${DIAL_EMERGENCY_FALLBACK:-}
      DIAL_CDR_HOOK: "no"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-dial}
      DB_USER: ${POSTGRES_USER:-dial}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dial}
      ARI_USER: ${ASTERISK_ARI_USER:-dial}
      ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-dial}
      AMI_USER: ${ASTERISK_AMI_USER:-dial}
      AMI_PASSWORD: ${ASTERISK_AMI_PASSWORD:-dial}
      SIP_DOMAIN: ${ASTERISK_SIP_DOMAIN:-dial.local}
      EXTERNAL_IP: ${EXTERNAL_IP:-}   # host LAN IP when not using network_mode: host
      RTP_START: "10000"
      RTP_END: "10200"
    # SIP/RTP through docker NAT is painful; on the event LAN prefer host networking:
    # network_mode: host
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
      - "8088:8088/tcp"     # ARI  (restrict to the DIAL network in production)
      - "8089:8089/tcp"     # WSS  (WebRTC scaffold)
      - "5038:5038/tcp"     # AMI  (optional)
      - "10000-10200:10000-10200/udp"
    volumes:
      - asterisk-voicemail:/var/spool/asterisk/voicemail   # share with DIAL for apps.voicemail
      - asterisk-sounds:/var/lib/asterisk/sounds/dial       # custom prompts / IVR audio uploaded by DIAL
      - asterisk-keys:/etc/asterisk/keys                   # mount your own asterisk.crt/.key/.pem here
      - asterisk-recordings:/var/spool/asterisk/dial-recordings  # share with DIAL (DIAL_RECORDING_DIR) for record-by-phone

volumes:
  asterisk-voicemail:
  asterisk-sounds:
  asterisk-keys:
  asterisk-recordings:
