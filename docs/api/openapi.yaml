components:
  schemas:
    Alert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: string
          readOnly: true
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        kind:
          type: string
          maxLength: 40
        rfp:
          type: integer
          nullable: true
        rfp_name:
          type: string
          readOnly: true
        message:
          type: string
          maxLength: 300
        created_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        notified:
          type: boolean
      required:
      - created_at
      - event
      - id
      - kind
      - message
      - rfp_name
      - severity
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        extension_number:
          type: string
          readOnly: true
        owner:
          type: string
          readOnly: true
        audio:
          type: string
          format: uri
          nullable: true
        tts_text:
          type: string
          description: Spoken when no audio file is uploaded.
        language:
          type: string
          maxLength: 8
        loop:
          type: boolean
          description: Repeat until the caller hangs up.
        dialplan:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - dialplan
      - extension_number
      - id
      - owner
    AnnouncementEnum:
      enum:
      - default
      - custom
      type: string
      description: |-
        * `default` - Default wake-up announcement
        * `custom` - Custom announcement
    AnnouncementRequest:
      type: object
      properties:
        event:
          type: string
          minLength: 1
          writeOnly: true
        number:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 16
        audio:
          type: string
          format: binary
          nullable: true
        tts_text:
          type: string
          description: Spoken when no audio file is uploaded.
        language:
          type: string
          minLength: 1
          maxLength: 8
        loop:
          type: boolean
          description: Repeat until the caller hangs up.
      required:
      - event
      - number
    CallGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: string
        number:
          type: string
          maxLength: 16
        name:
          type: string
          maxLength: 60
        owner:
          type: string
          readOnly: true
        admins:
          type: string
          readOnly: true
        state:
          type: string
          readOnly: true
        strategy:
          $ref: '#/components/schemas/StrategyEnum'
        shortcode:
          type: string
          description: Short label (e.g. SEC, MED) shown in front of the caller name
            when the group rings a member.
          maxLength: 8
        ring_timeout:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Seconds to ring (per member for serial strategies).
        wrap_up_seconds:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Members are skipped for this many seconds after their last
            group call.
        allow_self_service:
          type: boolean
          default: true
        description:
          type: string
          maxLength: 200
        user_group:
          type: string
          nullable: true
        members_total:
          type: string
          readOnly: true
        members_logged_in:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - admins
      - created_at
      - event
      - id
      - members_logged_in
      - members_total
      - name
      - number
      - owner
      - state
      - updated_at
    CallGroupRequest:
      type: object
      properties:
        event:
          type: string
          minLength: 1
        number:
          type: string
          minLength: 1
          maxLength: 16
        name:
          type: string
          minLength: 1
          maxLength: 60
        strategy:
          $ref: '#/components/schemas/StrategyEnum'
        shortcode:
          type: string
          description: Short label (e.g. SEC, MED) shown in front of the caller name
            when the group rings a member.
          maxLength: 8
        ring_timeout:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Seconds to ring (per member for serial strategies).
        wrap_up_seconds:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Members are skipped for this many seconds after their last
            group call.
        allow_self_service:
          type: boolean
          default: true
        description:
          type: string
          maxLength: 200
        user_group:
          type: string
          minLength: 1
          nullable: true
      required:
      - event
      - name
      - number
    CallbackRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: string
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          default: ccbs
        requester_number:
          type: string
          maxLength: 16
        target_number:
          type: string
          maxLength: 16
        state:
          allOf:
          - $ref: '#/components/schemas/CallbackStateEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        attempts:
          type: integer
          readOnly: true
        last_attempt_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        next_attempt_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        channel_id:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
      required:
      - attempts
      - channel_id
      - created_at
      - event
      - expires_at
      - id
      - last_attempt_at
      - next_attempt_at
      - note
      - requester_number
      - state
      - target_number
    CallbackRequestRequest:
      type: object
      properties:
        event:
          type: string
          minLength: 1
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          default: ccbs
        requester_number:
          type: string
          minLength: 1
          maxLength: 16
        target_number:
          type: string
          minLength: 1
          maxLength: 16
      required:
      - event
      - requester_number
      - target_number
    CallbackStateEnum:
      enum:
      - pending
      - dialing
      - completed
      - cancelled
      - expired
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `dialing` - Dialing
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `expired` - Expired
        * `failed` - Failed
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event:
          type: string
          readOnly: true
        owner:
          type: string
          title: Nickname
          description: Public handle shown in phonebooks.
          readOnly: true
        type:
          $ref: '#/components/schemas/TypeEdeEnum'
        name:
          type: string
          description: Free-form label, e.g. 'my orange handset'
          maxLength: 80
        state:
          allOf:
          - $ref: '#/components/schemas/State854Enum'
          readOnly: true
        ipei:
          oneOf:
          - type: string
            pattern: ^\d{13}$
            maxLength: 13
          - type: string
            maxLength: 0
        handset_model:
          type: string
          maxLength: 60
        omm_ppn:
          type: string
          readOnly: true
          description: Portable part number in the OMM.
        last_seen_rfp:
          type: integer
          readOnly: true
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        battery_percent:
          type: integer
          readOnly: true
          nullable: true
        rssi:
          type: integer
          readOnly: true
          nullable: true
        sip_username:
          type: string
          readOnly: true
        sip_transport:
          $ref: '#/components/schemas/SipTransportEnum'
        sip_registered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        mac_address:
          type: string
          maxLength: 17
        extensions:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - battery_percent
      - created_at
      - event
      - extensions
      - id
      - ipei
      - last_seen_at
      - last_seen_rfp
      - omm_ppn
      - owner
      - rssi
      - sip_registered_at
      - sip_username
      - state
      - type
