openapi: 3.0.3
info:
  title: PET - Portable Event Telephone API
  version: 1.0.0
  description: REST API for events, extensions, devices, DECT, callbacks and more.
paths:
  /api/v1/availability/:
    get:
      operationId: v1_availability_retrieve
      description: Live availability check used by the self-service portal while typing.
      parameters:
      - in: query
        name: block_digits
        schema:
          type: integer
        description: 'Trunks: check the whole block (1-3 digits)'
      - in: query
        name: event
        schema:
          type: string
        required: true
      - in: query
        name: number
        schema:
          type: string
        required: true
      - in: query
        name: type
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
