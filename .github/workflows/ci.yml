name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  # dependencies come straight from pyproject.toml (flat layout, not wheel-installable)
  DEPS_CMD: >-
    python -c "import tomllib; d = tomllib.load(open('pyproject.toml', 'rb'))['project'];
    print('\n'.join(d['dependencies'] + d['optional-dependencies']['dev']))"

jobs:
  test:
    name: lint, migrations, tests, openapi
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pet
          POSTGRES_PASSWORD: pet
          POSTGRES_DB: pet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pet -d pet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          eval "$DEPS_CMD" > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Ruff
        run: ruff check apps pet

      - name: Migrations are up to date
        env:
          DJANGO_SETTINGS_MODULE: pet.settings.test
        run: python manage.py makemigrations --check --dry-run

      - name: Unit tests (sqlite, pet.settings.test)
        run: python -m pytest -p no:cacheprovider

      - name: Migrations apply on PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: pet.settings.dev
          DATABASE_URL: postgres://pet:pet@localhost:5432/pet
          SECRET_KEY: ci
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py check --deploy --settings=pet.settings.prod --fail-level ERROR

      - name: OpenAPI schema
        env:
          DJANGO_SETTINGS_MODULE: pet.settings.test
        run: python manage.py spectacular --file openapi.yaml --validate

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.yaml

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build PET image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Asterisk image
        uses: docker/build-push-action@v6
        with:
          context: deploy/asterisk
          push: false
          tags: pet-asterisk:ci
          cache-from: type=gha,scope=asterisk
          cache-to: type=gha,mode=max,scope=asterisk

      - name: Smoke test image
        run: docker run --rm -e SECRET_KEY=ci -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 pet:ci python manage.py check

  integration:
    name: integration (live Asterisk)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          eval "$DEPS_CMD" > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build -d
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/ >/dev/null && break
            sleep 5
          done
          curl -fsS -u pet:pet http://localhost:8088/ari/asterisk/info
          docker compose exec -T web python manage.py migrate --check

      - name: Integration tests
        env:
          PET_INTEGRATION: "1"
          ASTERISK_ARI_URL: http://127.0.0.1:8088/ari
          ASTERISK_ARI_USER: pet
          ASTERISK_ARI_PASSWORD: pet
        run: python -m pytest tests/integration -p no:cacheprovider -v

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v
